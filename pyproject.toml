[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamiccluster"
version = "0.1.0"
description = "Dynamic clustering of multivariate panel data via a GAS-driven HMM mixture model."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
authors = [
    { name = "Daan Zunnenberg" },
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["dynamiccluster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
